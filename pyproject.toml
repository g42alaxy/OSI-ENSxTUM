[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mofpipe"
version = "0.2.0"
description = "Deterministic MOF arrangement/topology ranking pipeline with optional A1/A2/A67 runtime agents"
requires-python = ">=3.10"
# The pipeline core is standard-library Python. These packages run the periodic DFT engine
# (protocols.dft.engine = "pyscf"): PySCF GPW, DFT-D3/D4 dispersion and ASE relaxations.
dependencies = [
    "pyscf>=2.14",
    "pyscf-dispersion>=1.5",
    "ase>=3.23",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# protocols.dft.device = "gpu": pick the gpu4pyscf wheel matching the installed CUDA toolkit (cuda11x/cuda12x/...).
gpu = ["gpu4pyscf-cuda12x>=1.8"]
# Runtime agents (python -m mofpipe agents): OpenRouter requests, strict schemas, controls.yaml, LangGraph
# orchestration, Valency MCP client, local PDF text and the reference datasets (parquet + HDF5, Hugging Face). The deterministic pipeline never imports these.
agents = ["requests>=2.31", "jsonschema>=4.21", "pyyaml>=6", "langgraph>=0.4", "mcp>=1.9", "pypdf>=4",
          "pandas>=2", "pyarrow>=14", "h5py>=3.9", "huggingface_hub>=0.23"]
# Task 02 ML-potential screening (protocols.ml_potential): orb-v3 conservative (OMat24) + D3(BJ) through ASE.
mlip = ["orb-models>=0.7"]
# T04.3: QAOA sampling on Qiskit fake IBM devices (qpu_worker.py).
qpu = ["qiskit>=2.0", "qiskit-aer>=0.17", "qiskit-ibm-runtime>=0.40"]
# T10.1: AiiDA WorkChain engine with stage provenance (local `verdi presto` profile, no services).
aiida = ["aiida-core>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "pyscf: runs real PySCF calculations (minutes on a laptop CPU); deselect with -m 'not pyscf'",
]
